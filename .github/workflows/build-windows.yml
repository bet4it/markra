name: Build Windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build
        required: false
        default: ""
        type: string
      debug:
        description: Build debug bundle (faster, larger, unsigned)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DESKTOP_DIR: apps/desktop
  NODE_VERSION: 24
  PNPM_VERSION: 10.30.3

jobs:
  build:
    name: Build Windows (${{ github.event.inputs.debug == 'true' && 'debug' || 'release' }})
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Resolve checkout ref
        id: ref
        shell: bash
        run: |
          ref="${{ github.event.inputs.ref }}"
          if [[ -z "${ref}" ]]; then
            ref="${{ github.ref }}"
          fi
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.DESKTOP_DIR }}/src-tauri -> target
          cache-bin: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows bundle
        shell: bash
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event.inputs.debug }}" == "true" ]]; then
            pnpm tauri build --debug --target x86_64-pc-windows-msvc
          else
            pnpm tauri build --target x86_64-pc-windows-msvc
          fi

      - name: Collect bundle paths
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          target="x86_64-pc-windows-msvc"
          profile="release"
          if [[ "${{ github.event.inputs.debug }}" == "true" ]]; then
            profile="debug"
          fi
          bundle_root="${{ env.DESKTOP_DIR }}/src-tauri/target/${target}/${profile}/bundle"
          find "${bundle_root}" -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.nsis.zip' \) -print             | while IFS= read -r f; do
                cp "${f}" "artifacts/"
              done
          ls -la artifacts

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: markra-windows-bundle
          path: artifacts/*
          if-no-files-found: error
